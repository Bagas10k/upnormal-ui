[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upnormal-ui"
version = "1.0.0"
description = "The Anti-AI-Slop UI/UX Engine & Design System for Autonomous Agents & Developers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bagas Saputra (Bagas Cihuy)", email = "bagas.office01@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ui-ux",
    "design-system",
    "anti-ai-slop",
    "tailwind",
    "blade",
    "motion-morphing",
    "wcag-aaa"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
upnormal-ui = "upnormal_ui.cli:main"

[project.urls]
Homepage = "https://github.com/Bagas10k/upnormal-ui"
Repository = "https://github.com/Bagas10k/upnormal-ui"
Issues = "https://github.com/Bagas10k/upnormal-ui/issues"
